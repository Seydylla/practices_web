<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin to Dec</title>
</head>
<body>

    <style>
        body {
            background-color: black; 
            color: white;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        #binaryInput {
            padding: 0.5em 1em;
            font-size: 1em;
            outline: none;
            border: none;
            width: 200px;
            border-radius: 1em;
        }
    </style>

    <div class="container">
        <h1>Binary to Decimal Converter</h1>
        <input type="text" placeholder="Enter binary" id="binaryInput">
        <button id="submit">Submit</button>
    </div>
    
</body>
</html>
