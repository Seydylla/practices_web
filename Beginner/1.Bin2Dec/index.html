<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin to Dec</title>
</head>
<body>

    <style>
        body {
            background-color: black; 
            color: white;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        #binaryInput {
            padding: 0.5em 1em;
            font-size: 1em;
            outline: none;
            border: none;
            width: 200px;
            border-radius: 1em;
        }

        #submit {
            padding: 0.5em 1em;
            font-size: 1em;
            outline: none;
            border: none;
            width: 100px;
            border-radius: 1em;
            cursor: pointer;
        }

        #decimalOutput {
            color: black;
            background-color: white;
            padding: 0.5em 1em;
            font-size: 1em;
            outline: none;
            border: none;
            width: 200px;
            border-radius: 1em;
        }
    </style>

    <div class="container">
        <h1>Binary to Decimal Converter</h1>
        <input type="number" placeholder="Enter binary" id="binaryInput">
        <button id="submit">Submit</button>
        <div id="decimalOutput">Decimal Result</div>
    </div>

    <script>
        const submit = document.getElementById('submit')
        const output = document.getElementById('decimalOutput')
        submit.addEventListener("click", () => {
            let value = document.getElementById('binaryInput').value
            let hasError = false;

            if (value === "") {
                hasError = true;
            } else {
                for (let i = 0; i < value.length; i++) {
                    if (value[i] !== '0' && value[i] !== '1') {
                        hasError = true;
                    }
                }
            }

            if (value.length > 8) {
                output.innerText = 'Error: Max 8 digits allowed'
            } else if(hasError) {
                output.innerText = 'Error: Just 0 or 1'
            } else {
                let result = 0;
                let power = 0;
                
                for (let i = value.length - 1; i >= 0; i--) {
                    if (value[i] === '1') {
                        result += 2 ** power;
                    }
                    power++;
                }
                
                output.innerText = result;
            }
        })
    </script>
    
</body>
</html>
